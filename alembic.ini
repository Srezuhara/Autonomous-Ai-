[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Deliberately blank. The URL comes from `api_platform.db.current_url()` in
# env.py, which reads DATABASE_URL and otherwise derives the path from the
# live DB_PATH. Setting it here would give Alembic a second, staler opinion
# about which database it is looking at.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
